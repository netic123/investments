name: PLS1 prospective lockbox

on:
  schedule:
    - cron: '17 6 * * *'
    - cron: '17 9 * * *'
    - cron: '17 11 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: lockbox
  cancel-in-progress: false

jobs:
  preactivation-audit:
    if: >-
      github.repository == 'netic123/investments' &&
      github.ref == 'refs/heads/main' &&
      github.workflow_ref == 'netic123/investments/.github/workflows/pls1-lockbox.yml@refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'
          package-manager-cache: false
      - name: Verify frozen model and existing chain
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          node --test test/fear_greed_control_residual_pls1.test.js \
            test/fear_greed_control_residual_pls1_properties.test.js \
            test/pls1_lockbox.test.js \
            test/pls1_lockbox_anchor.test.js \
            test/pls1_lockbox_tuf_anchor.test.js \
            test/pls1_lockbox_evaluator.test.js \
            test/pls1_lockbox_git_binding.test.js \
            test/pls1_lockbox_inventory.test.js \
            test/pls1_lockbox_seed_common_regressions.test.js \
            test/pls1_lockbox_tail_equivalence.test.js
      - name: Production activation safety lock
        shell: bash
        run: |
          echo "PLS1_REMOTE_INTEGRITY_ACTIVATION_DISABLED: the workflow remains read-only until complete effective-ruleset/bypass evidence and every terminal run-attempt reconciliation are integrated and independently reviewed." >&2
          exit 1
