name: Deploy GitHub Pages

'on':
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # WAGN's holdings file is normally published overnight and the matching
    # NAV file later in the morning UTC. A daily build also detects a newly
    # filed Dalal Street 13F without requiring a code commit.
    - cron: '15 9 * * *'

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build public snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Refuse tracked private position files
        shell: bash
        run: |
          set -euo pipefail
          for file in data/positions.local.json data/portfolio.local.json; do
            if git ls-files --error-unmatch "$file" >/dev/null 2>&1; then
              echo "::error::$file is private and must never be tracked or published"
              exit 1
            fi
          done

      - name: Test repository-owned market models
        # Three research suites are machine-anchored by their frozen chains and
        # cannot pass on a fresh runner: the proxy-v2 suites byte-verify frozen
        # inputs under gitignored research/local-artifacts/, and the
        # component-fragility suite exercises a one-shot launcher whose freeze
        # manifest deliberately pins the freeze machine's node version,
        # platform (win32) and arch. All three test files are hash-pinned by
        # frozen protocol chains, so skip guards cannot be added inside them
        # without breaking the freezes; they are excluded here instead and run
        # in full on the machine that holds the frozen state.
        shell: bash
        run: |
          set -euo pipefail
          node --test $(ls test/*.test.js | grep -v -E 'five_market_proxy_data_v2|universal_volatility_overlay_proxy_splitter_v2|component_fragility_tail_risk')

      - name: Build and validate public snapshot
        env:
          INVESTMENTS_PREVIOUS_PUBLIC_HOLDINGS_URL: https://netic123.github.io/investments/api/holdings.json
        run: node scripts/build-pages.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          include-hidden-files: true

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
