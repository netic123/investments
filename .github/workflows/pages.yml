name: Deploy GitHub Pages

'on':
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      skip_tests:
        # The page's owner-only "Update (rebuild)" button dispatches this
        # workflow with skip_tests=true: the suite already ran on the push that
        # deployed the code, and a live update should finish in minutes.
        description: 'Skip the test suite (live update from the page; the tests ran on push)'
        type: boolean
        default: false
      reason:
        description: 'Why this build was requested (recorded in api/build.json)'
        type: string
        default: ''
  schedule:
    # WAGN's holdings file is normally published just after 00:00 UTC (dated the
    # next weekday) and the matching NAV file around 08:40 UTC. GitHub starts
    # scheduled runs late (5 to 11 hours after the cron time was observed in
    # August 2026), so the public snapshot keeps itself fresh with an hourly
    # slot on weekdays: even a late start lands within the hour, and a
    # transient upstream failure costs an hour, not a day. The 09:20 slot runs
    # every day (Crypto trades on weekends) and is the one that also runs the
    # test suite; the other hourly slots skip it, because the suite already ran
    # on the push that deployed the code. Fear & Greed bars for a trading day
    # enter the first build after that exchange's local midnight, because only
    # completed source-local dates are scored. Every build also detects a
    # newly filed Dalal Street 13F without a code commit.
    - cron: '20 9 * * *'
    - cron: '20 5-8,10-22 * * 1-5'

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build public snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'
          package-manager-cache: false

      - name: Refuse tracked private position files
        shell: bash
        run: |
          set -euo pipefail
          for file in data/positions.local.json data/portfolio.local.json; do
            if git ls-files --error-unmatch "$file" >/dev/null 2>&1; then
              echo "::error::$file is private and must never be tracked or published"
              exit 1
            fi
          done
          if git ls-files 'data/*.local*' | grep -q .; then
            echo "::error::a data/*.local* file is tracked; private variants and backups must never be committed"
            exit 1
          fi

      - name: Test repository-owned market models
        # Runs on every push, on the daily 09:20 UTC slot, and on a manual
        # dispatch that did not ask to skip it. The hourly refresh slots and the
        # page's live update skip it: the code did not change since the push
        # that already ran it, and the snapshot validation in build-pages.js is
        # what protects the published data.
        if: ${{ github.event_name == 'push' || (github.event_name == 'schedule' && github.event.schedule == '20 9 * * *') || (github.event_name == 'workflow_dispatch' && !(inputs.skip_tests == true || inputs.skip_tests == 'true')) }}
        # Three research suites are machine-anchored by their frozen chains and
        # cannot pass on a fresh runner: the proxy-v2 suites byte-verify frozen
        # inputs under gitignored research/local-artifacts/, and the
        # component-fragility suite exercises a one-shot launcher whose freeze
        # manifest deliberately pins the freeze machine's node version,
        # platform (win32) and arch. All three test files are hash-pinned by
        # frozen protocol chains, so skip guards cannot be added inside them
        # without breaking the freezes; they are excluded here instead and run
        # in full on the machine that holds the frozen state.
        shell: bash
        run: |
          set -euo pipefail
          node --test $(ls test/*.test.js | grep -v -E 'five_market_proxy_data_v2|universal_volatility_overlay_proxy_splitter_v2|component_fragility_tail_risk')

      - name: Build and validate public snapshot
        env:
          INVESTMENTS_PREVIOUS_PUBLIC_HOLDINGS_URL: https://netic123.github.io/investments/api/holdings.json
          # Recorded in api/build.json so the page can say what triggered a build.
          INVESTMENTS_BUILD_TRIGGER: ${{ github.event_name }}
          INVESTMENTS_BUILD_REASON: ${{ inputs.reason }}
          INVESTMENTS_BUILD_SCHEDULE: ${{ github.event.schedule }}
          INVESTMENTS_BUILD_TESTS_SKIPPED: ${{ !(github.event_name == 'push' || (github.event_name == 'schedule' && github.event.schedule == '20 9 * * *') || (github.event_name == 'workflow_dispatch' && !(inputs.skip_tests == true || inputs.skip_tests == 'true'))) }}
          # Optional repository variable: a declared User-Agent with a real
          # e-mail contact for SEC EDGAR, e.g. "netic123-investments/1.0 (you@example.com)".
          # It must not mention github.com or github.io, which SEC's edge
          # rejects. Without it the built-in default is accepted by data.sec.gov
          # but not reliably by www.sec.gov, so the 13F usually falls back to
          # the labelled manual copy.
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: node scripts/build-pages.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          include-hidden-files: true

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
